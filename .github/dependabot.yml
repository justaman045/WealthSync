version: 2

# Dependabot exists here to keep the CI-only rules harness and the pinned
# GitHub Actions current — nothing in this repo is published to npm.
updates:
  # The emulator harness (`tool/rules_tests/`) is the only npm manifest. Its
  # dependency tree belongs to firebase-tools, which is a CI tool and never
  # ships to a user. Five transitive packages carry advisories with no
  # resolvable fix in that tree:
  #
  #   uuid                 firebase-tools -> gaxios@6.7.1 requires uuid@^9.0.1,
  #                        while the patched uuid is 14.x. The only "fix" npm can
  #                        compute is downgrading firebase-tools itself.
  #   @grpc/grpc-js        same story (1.9.16 under firebase-tools; 1.14.x exists
  #                        elsewhere in the tree but cannot be hoisted).
  #   @opentelemetry/core  1.30.1 is the last 1.x; the patched line is 2.x.
  #   minimatch            10.x/11.x carry the fix (earliest fixed 11.0.1); the
  #                        resolvable path through firebase-tools@15.34.1
  #                        (glob@10.5.0 -> minimatch@^9.0.4) tops out at 9.0.9, so
  #                        Dependabot reports `security_update_not_possible`.
  #   glob                 the resolvable path through firebase-tools@15.34.1
  #                        (glob@10.5.0) tops out at an unpatched line (earliest
  #                        fixed 14.0.2), so Dependabot reports
  #                        `security_update_not_possible`.
  #
  # Dependabot's security-update jobs for them fail on the default branch with
  # `security_update_not_possible` and turn every push red for a dependency that
  # has no user-facing exposure. They are ignored here (alerts stay visible in
  # the Security tab) until firebase-tools moves to a patched line.
  #
  # Do NOT ignore their *direct* equivalents: if any of these ever becomes a
  # first-party dependency of the app, delete the matching ignore entry.
  - package-ecosystem: npm
    directory: /tool/rules_tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rules-harness:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: uuid
      - dependency-name: "@grpc/grpc-js"
      - dependency-name: "@opentelemetry/core"
      - dependency-name: minimatch
      - dependency-name: glob

  # Workflow actions are pinned by tag (`actions/checkout@v5`, etc.); an action
  # major can change the runner contract, so Dependabot proposes those bumps and
  # the `test` job validates the result.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
