name: Build Flutter APK

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "app_version.json"
      # The release commit itself only changes pubspec.yaml + app_version.json;
      # ignoring them here prevents the workflow from re-triggering on its own
      # `CI:` commit and burning a whole release cycle (new run_number) for it.
      #
      # Safety: this does NOT let a real dependency change slip through — a
      # `pubspec.yaml` edit that alters dependencies also rewrites the tracked
      # `pubspec.lock`, which is not ignored, so the build still runs. Only a
      # bare `version:` bump (which is what CI itself commits) is skipped.
      - "pubspec.yaml"
  pull_request:
    branches: [master]
  # Nightly end-to-end run against the live Firebase test accounts. It runs the
  # same suite the manual dispatch does, but never builds or publishes a
  # release (build/release/build_web all exclude `schedule`). This is what keeps
  # the E2E coverage from rotting between opt-in release runs.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Run E2E integration tests on the Android emulator (live Firebase test accounts)"
        type: boolean
        required: false
        default: false
      deploy_firebase:
        description: "Deploy Firestore rules/indexes + Storage rules to production (needs the FIREBASE_TOKEN secret)"
        type: boolean
        required: false
        default: false

# Least privilege by default. Jobs that must push (release commit, gh-pages)
# opt into `contents: write` individually — a workflow-wide write token is not
# needed by analyze/tests/rules/build, and the Pages/OIDC grants this workflow
# used to request globally were never required by peaceiris/actions-gh-pages.
permissions:
  contents: read

# Superseded PR runs are pointless; superseded master runs are not — cancelling
# one mid-release could leave a tag without its version commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.7"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  # ------------------------------------------------------------
  # ANALYZE + AUDIT + UNIT TESTS (+ web compile)
  # ------------------------------------------------------------
  test:
    name: Analyze, audit & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: UI revamp audit (design-debt caps)
        run: bash tool/check_ui_strings.sh --strict

      - name: Run unit & widget tests
        run: |
          mkdir -p build/report
          flutter test --file-reporter json:build/report/unit.json

      # dart2js is stricter than the analyzer and `flutter test` runs on the VM,
      # so a type error that passes every other check can still fail the web
      # build (see the `recordError`/`Map<String, Object?>` note in AGENTS.md).
      # Compiling here — on every event, including PRs — means that class of
      # error can never reach master, instead of only surfacing after merge in
      # the deploy job.
      - name: Web release compile check (dart2js)
        run: flutter build web --release --base-href /WealthSync/

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Just the reporter JSON: the combined HTML report is generated in the
          # integration job, which is where the screenshot + suite data exists.
          name: unit-test-report
          path: build/report/
          if-no-files-found: warn

  # ------------------------------------------------------------
  # FIRESTORE + STORAGE RULES (emulator)
  # ------------------------------------------------------------
  # `firebase deploy --dry-run` is the only real rules compiler and it needs
  # live credentials, which CI does not have. Loading the rules into the
  # emulators compiles them and then exercises owner isolation, malformed
  # document rejection, self-admin/self-pro escalation, and profile-picture
  # ownership — so a rules edit cannot ship unchecked.
  rules:
    name: Firestore & Storage rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Firestore emulator is a JVM process, and firebase-tools 15 refuses to
      # start it on anything older than Java 21 ("no longer supports Java
      # version before 21"). Java 17 — the pin the Android build needs — would
      # fail here, so this job pins 21 independently.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # firebase@13 (and @firebase/rules-unit-testing@6) declare
      # `node >=24.12.0`; the runner's default Node 22 installs with
      # EBADENGINE warnings and is not a supported runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tool/rules_tests/package-lock.json

      - name: Run rules tests
        run: bash tool/rules_tests/run.sh

  # ------------------------------------------------------------
  # MANUAL FIREBASE DEPLOY (rules / indexes / storage)
  # ------------------------------------------------------------
  # `firebase deploy` is the only thing that can change production security
  # rules, and it needs credentials CI does not otherwise have. The emulator
  # suite proves the rules *behave*; the published dry run proves the files
  # compile against the real project. Both must pass before the deploy.
  #
  # Dispatch-only and master-only on purpose: a push must never be able to
  # change production security rules without a human pressing the button.
  # FIREBASE_TOKEN comes from `firebase login:ci` and is read from the
  # environment — never interpolated into a `run:` script.
  deploy_firebase:
    name: Deploy Firebase rules
    runs-on: ubuntu-latest
    needs: [test, rules]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_firebase == 'true' && github.ref == 'refs/heads/master' && needs.test.result == 'success' && needs.rules.result == 'success' }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate deploy token
        env:
          FIREBASE_TOKEN_V: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN_V:-}" ]; then
            echo "::error::secret FIREBASE_TOKEN is empty — create one with 'firebase login:ci' and add it as a repository secret."
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.1

      # Always compile before writing: this is the same published dry run the
      # manual procedure requires, so the workflow cannot skip the check.
      - name: Compile rules (dry run)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project moneycontroljustaman045 \
            --non-interactive --dry-run

      - name: Deploy rules, indexes and storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project moneycontroljustaman045 \
            --non-interactive

  # ------------------------------------------------------------
  # E2E INTEGRATION TESTS (release gate + nightly)
  # ------------------------------------------------------------
  # These mutate the shared test accounts (create transactions, recurring
  # payments, etc.), so they never run on PRs. Two modes:
  #
  #   * master push  -> the four session/data-loss-critical files only
  #                     (settings, full backup, data management, transaction
  #                     management). This is the release gate: `build` and
  #                     `release` wait on it, so an APK can no longer publish
  #                     having never been driven end-to-end.
  #   * schedule / dispatch -> the whole suite, never publishing a release.
  #
  # A skipped run still lets `build`/`release` proceed (their status guard
  # accepts `skipped`), which is what keeps PRs and non-master dispatches cheap;
  # on master this job always runs, so the gate is real.
  #
  # Each file runs under a 15-minute timeout so one hung file cannot stall the
  # suite, and tool/run_integration_tests.sh restarts the emulator between files
  # (host-GL state accumulates across app launches and killed the second file).
  integration_test:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration_tests == 'true')) }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Pin the JDK: Gradle 9.3.1 / AGP 9.1 require JDK 17+, and relying on the
      # runner's default Java is how the local Android Studio JBR (Java 25) broke
      # the Gradle 8.14 build.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android build
        uses: ./.github/actions/android-setup
        with:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ndk_version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Empty dart-defines surface as `[firebase_auth/channel-error] Given String
      # is empty or null` on the login call — which reads like an auth bug and
      # wastes a six-hour E2E run. Fail before booting the emulator instead.
      - name: Validate E2E credentials
        env:
          TEST_EMAIL_V: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD_V: ${{ secrets.TEST_PASSWORD }}
          PRO_TEST_EMAIL_V: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD_V: ${{ secrets.PRO_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in TEST_EMAIL TEST_PASSWORD PRO_TEST_EMAIL PRO_TEST_PASSWORD; do
            eval "value=\${${name}_V:-}"
            if [ -z "$value" ]; then
              echo "::error::secret $name is empty — E2E cannot sign in without it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          cores: 4
          disable-animations: true
          # Invoked as a single line because this action executes its `script:`
          # input one line at a time via `/usr/bin/sh -c` — multi-line loops
          # must live in the committed bash file instead.
          script: bash tool/run_integration_tests.sh
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          # The harness wipes each account's data before every test file, so
          # one file cannot skew the next. It is opt-in (off by default)
          # because the wipe is irreversible and the same code path runs
          # against the Pro account — an implicit wipe once destroyed 791 live
          # transactions. These accounts are disposable, so CI opts in.
          E2E_ALLOW_WIPE: "true"
          # Master pushes run the release-critical subset; schedule/dispatch
          # leave this empty so the runner executes the whole suite. The
          # runner validates every name and fails on a typo rather than
          # running zero files and reporting a false green.
          E2E_FILES: ${{ github.event_name == 'push' && 'settings_test.dart full_backup_test.dart data_management_test.dart transaction_management_test.dart' || '' }}

      - name: Download unit test report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: build/report

      - name: Generate combined test report
        if: always()
        run: dart run tool/generate_test_report.dart --unit=build/report/unit.json --integration="$(ls build/report/parts/*.json 2>/dev/null | paste -sd,)" --screenshots=build/report/screenshots --out=build/report/report.html

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/report/report.html
          if-no-files-found: warn

  # ------------------------------------------------------------
  # ANDROID RELEASE BUILD (no publishing)
  # ------------------------------------------------------------
  # Release-producing build only on master pushes or manual dispatch. PRs must
  # not bump versions, create releases, or deploy Pages — and their detached-HEAD
  # checkout makes the release commit fail outright.
  #
  # Gated on the unit suite, the rules tests, and — only when an opt-in E2E run
  # actually happens — the E2E suite.
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: [test, rules, integration_test]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.event_name != 'schedule' && needs.test.result == 'success' && needs.rules.result == 'success' && (needs.integration_test.result == 'success' || needs.integration_test.result == 'skipped') }}
    timeout-minutes: 60
    permissions:
      # Read-only: this job no longer commits the version bump. The version is
      # written into the working tree so the artifact carries it, and committed
      # only by the `release` job after the smoke test proves the APK launches.
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android build
        uses: ./.github/actions/android-setup
        with:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ndk_version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      # Stamp the version into the working tree (not committed yet) so the
      # built artifact carries `2.0.<run_number>+<run_number>`. Committing only
      # after the release is verified avoids the old failure mode where a
      # broken build still left master claiming a version that never shipped.
      - name: Stamp release version
        run: |
          set -euo pipefail
          VERSION="2.0.${{ github.run_number }}"
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Decode release keystore
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_KEYSTORE:-}" ]; then
            echo "::error::UPLOAD_KEYSTORE is empty. Add the base64-encoded release keystore as a repository secret."
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > android/upload-keystore.jks
          chmod +x android/gradlew

      - name: Build AAB with signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      # ONE universal APK, deliberately.
      #
      # Split-per-ABI builds were removed on purpose — do not re-add
      # `--split-per-abi`. Two reproduced failures came from them:
      #   1. An ABI split installs only on a device carrying that ABI, so the
      #      arm64 split failed on 32-bit/x86 phones ("app not meant for this
      #      device"), and the x86_64 split can never install on any phone.
      #   2. Flutter overrides a split's versionCode to `abiVersion * 1000 +
      #      versionCode` (FlutterPlugin.kt; arm64 split = 2169 vs universal
      #      169), so anyone who side-loaded the arm64 split could never take
      #      the in-app update — the updater downloads the *universal* APK and
      #      Android rejects the lower versionCode with
      #      INSTALL_FAILED_VERSION_DOWNGRADE.
      - name: Build APK with signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      # apksigner exits non-zero on any signature problem, so a broken/partial
      # signature fails here instead of shipping an APK that Android rejects
      # with "There was a problem parsing the package".
      #
      # Note: `enableV1Signing` is a silent no-op on AGP 9.1.0 (both CI and
      # local release APKs report v1: false because ML Kit/cupertino asset
      # entries are omitted from the JAR manifest). That does not block installs
      # at minSdk 24+, which validate v2/v3 and ignore v1.
      - name: Verify APK signature
        run: |
          set -eu
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      # The in-app updater compares the *published* APK's versionCode against
      # the installed one, so a versionCode that does not match the release tag
      # breaks updates silently. Assert it, and assert the APK is still the
      # single universal artifact (all three shipped ABIs) rather than a split.
      - name: Verify universal APK + version
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT" ]; then
            AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          fi
          echo "Using $AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -3

          EXPECTED_NAME="2.0.${{ github.run_number }}"
          EXPECTED_CODE="${{ github.run_number }}"

          NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          [ "$NAME" = "$EXPECTED_NAME" ] || { echo "::error::versionName '$NAME' != '$EXPECTED_NAME'"; exit 1; }
          [ "$CODE" = "$EXPECTED_CODE" ] || { echo "::error::versionCode '$CODE' != '$EXPECTED_CODE'"; exit 1; }

          NATIVE="$(printf '%s\n' "$BADGING" | sed -n 's/^native-code: //p' | head -1)"
          echo "native-code: $NATIVE"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$NATIVE" in
              *"'$abi'"*) ;;
              *) echo "::error::APK is missing ABI $abi — it is not the universal artifact"; exit 1 ;;
            esac
          done

      - name: Generate checksums
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          sha256sum \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: build/SHA256SUMS

  # ------------------------------------------------------------
  # RELEASE SMOKE TEST (installs the *release* APK)
  # ------------------------------------------------------------
  # R8 minify is ON for release and every unit/integration test runs a DEBUG
  # build, so a shrunk reflective constructor only fails when a release APK
  # launches (the Room `WorkDatabase_Impl.<init>` crash shipped for exactly that
  # reason). This job installs the exact artifact that will be published,
  # launches it, and fails on a startup crash/ANR — before the release exists.
  android_smoke:
    name: Release APK launch smoke test
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          cores: 4
          disable-animations: true
          script: bash tool/smoke_release_apk.sh build/app/outputs/flutter-apk/app-release.apk

  # ------------------------------------------------------------
  # PUBLISH RELEASE (only after the smoke test passed)
  # ------------------------------------------------------------
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, android_smoke, integration_test]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.event_name != 'schedule' && needs.build.result == 'success' && needs.android_smoke.result == 'success' && (needs.integration_test.result == 'success' || needs.integration_test.result == 'skipped') }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: 2.0.${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release.aab
          path: build/release-assets

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/release-assets

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: build/release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release-assets/app-release.aab
            build/release-assets/app-release.apk
            build/release-assets/SHA256SUMS
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The version is committed only now, after assets exist and the APK has
      # been proven to launch. A single `CI:` commit (instead of two) means one
      # push, so there is only one chance to race another merge.
      #
      # The guard skips a run triggered by CI's own release commit. It must NOT
      # test the message for a "CI:" prefix: Actions' `contains()`/`startsWith()`
      # are case-INsensitive, so every commit titled "ci: …" (including the very
      # commit that introduced this pipeline) silently matched the guard and
      # never bumped the version. `paths-ignore` is the primary loop guard (and
      # a GITHUB_TOKEN push does not start a new run at all); this is the
      # backstop, keyed on the committer created by the `git config` below.
      - name: Commit version bump and app_version.json
        if: ${{ github.event.head_commit.committer.name != 'GitHub Actions' }}
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
          printf '{\n  "latest_version": "%s",\n  "update_message": "A new version is available.",\n  "force": false\n}\n' "$VERSION" > app_version.json

          git add pubspec.yaml app_version.json
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION; nothing to commit."
            exit 0
          fi
          git commit -m "CI: Release $VERSION"

          # Reconcile with any commits pushed mid-build so the push stays a
          # fast-forward (a bare push fails with "[rejected] master -> master
          # (fetch first)" if another commit landed meanwhile).
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed $VERSION."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/master."
            git pull --rebase origin master
          done
          echo "::error::Could not push the version commit after 3 attempts."
          exit 1

  # ------------------------------------------------------------
  # WEB BUILD & DEPLOY to GitHub Pages
  # ------------------------------------------------------------
  # Pages deployment is master-push/manual only — never from pull requests or
  # the nightly E2E schedule. Gated on the unit suite and (when an opt-in E2E
  # run happens) the E2E suite, same as the Android build.
  build_web:
    name: Build & deploy web
    runs-on: ubuntu-latest
    needs: [test, integration_test]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.event_name != 'schedule' && needs.test.result == 'success' && (needs.integration_test.result == 'success' || needs.integration_test.result == 'skipped') }}
    timeout-minutes: 30
    permissions:
      # gh-pages is a branch: pushing it needs contents: write. The Pages API
      # and OIDC tokens this workflow used to request globally are not used by
      # peaceiris/actions-gh-pages.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (Release)
        run: flutter build web --release --base-href /WealthSync/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          user_name: "GitHub Actions"
          user_email: "actions@github.com"
