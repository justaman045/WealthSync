name: Build Flutter APK

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "app_version.json"
      # The version-bump commit itself only changes pubspec.yaml; ignoring it
      # here prevents the workflow from re-triggering on its own CI: commit.
      - "pubspec.yaml"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Run E2E integration tests on the Android emulator (live Firebase test accounts)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Run analysis and tests before building — broken code must not ship.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Add google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: UI revamp audit (design-debt caps)
        run: bash tool/check_ui_strings.sh --strict

      - name: Run unit & widget tests
        run: |
          mkdir -p build/report
          flutter test --file-reporter json:build/report/unit.json

      - name: Generate unit test report
        if: always()
        run: dart run tool/generate_test_report.dart --unit=build/report/unit.json --out=build/report/unit_report.html

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Upload the whole report dir (unit.json + unit_report.html) so the
          # integration job's combined report can embed the unit results.
          name: unit-test-report
          path: build/report/
          if-no-files-found: warn

  # End-to-end tests against the live Firebase backend on an Android emulator.
  # These mutate the shared test account (create transactions, recurring
  # payments, etc.), so they NEVER run automatically: the job is skipped unless
  # a manual workflow_dispatch is fired with the `run_integration_tests` input
  # set to true. When opted in they GATE the build: build/build_web wait on this
  # job with a status guard, so an E2E failure still blocks the release, while a
  # skipped run lets them proceed on analyze + unit tests alone. To re-enable a
  # hard master-push gate later, drop the job's `if` condition (or add a master
  # push trigger back) — the tooling and secrets are fully intact. Each test
  # file runs under a 15-minute timeout so a single hung file can't stall the
  # suite. A downloadable report (pass/fail, errors, screenshots) is generated
  # and uploaded whether the suite passes or fails.
  integration_test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration_tests == 'true'
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Add google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          cores: 4
          disable-animations: true
          # Invoked as a single line because this action executes its `script:`
          # input one line at a time via `/usr/bin/sh -c` — multi-line loops
          # must live in the committed bash file instead.
          script: bash tool/run_integration_tests.sh
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}

      - name: Download unit test report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: build/report

      - name: Generate combined test report
        if: always()
        run: dart run tool/generate_test_report.dart --unit=build/report/unit.json --integration="$(ls build/report/parts/*.json 2>/dev/null | paste -sd,)" --screenshots=build/report/screenshots --out=build/report/report.html

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/report/report.html
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: [test, integration_test]
    # Release-producing build only on master pushes (or manual dispatch). PRs
    # must not bump versions, create releases, or deploy Pages — and their
    # detached-HEAD checkout makes the CI commit step fail outright.
    # Gated on the unit/widget suite and — only when an opt-in E2E run actually
    # happens — on the E2E suite: the integration job is skipped by default, so
    # this explicit status guard lets a skipped run ship while a failed one
    # still blocks the release.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.integration_test.result == 'success' || needs.integration_test.result == 'skipped') }}

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # SETUP FLUTTER
      # ------------------------------------------------------------
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      # ------------------------------------------------------------
      # AUTO VERSION BUMP: pubspec.yaml
      # ------------------------------------------------------------
      - name: Auto-update version in pubspec.yaml
        run: |
          VERSION="2.0.${{ github.run_number }}"
          echo "Updating pubspec.yaml version to: $VERSION"

          sed -i "s/^version:.*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Commit updated pubspec.yaml
        if: "! contains(github.event.head_commit.message, 'CI:')"
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if git diff --quiet pubspec.yaml; then
            echo "No changes in pubspec.yaml"
          else
            git add pubspec.yaml
            git commit -m "CI: Auto-update version to 2.0.${{ github.run_number }}"
            # Reconcile with any commits pushed mid-build so the push stays a
            # fast-forward (a bare push fails with "[rejected] master -> master
            # (fetch first)" if another commit landed on master meanwhile).
            git pull --rebase origin master
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # ANDROID KEYSTORE + GOOGLE SERVICES
      # ------------------------------------------------------------
      - name: Decode keystore from secret
        run: echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > android/upload-keystore.jks

      - name: Add google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ------------------------------------------------------------
      # BUILD AAB + APK (signed)
      # ------------------------------------------------------------
      - name: Build AAB with signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Build APK with signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      # ------------------------------------------------------------
      # UPLOAD ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ------------------------------------------------------------
      # CREATE RELEASE (AUTO-GENERATED RELEASE NOTES)
      # ------------------------------------------------------------
      - name: Create GitHub Release & Upload AAB + APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          tag_name: v2.0.${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # UPDATE README WITH LATEST APK DOWNLOAD LINK
      # ------------------------------------------------------------
      - name: Update README with latest APK download link
        run: |
          TAG="v2.0.${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"

          echo "Updating README with: $DOWNLOAD_URL"

          sed -i "s|https://github.com/.*/releases/download/.*|$DOWNLOAD_URL|g" README.md

      - name: Commit updated README
        if: "! contains(github.event.head_commit.message, 'CI:')"
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if git diff --quiet README.md; then
            echo "README not changed"
          else
            git add README.md
            git commit -m "CI: Update README APK link v2.0.${{ github.run_number }}"
            # Reconcile with any commits pushed mid-build (see pubspec step).
            git pull --rebase origin master
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # UPDATE app_version.json (used for in-app update)
      # ------------------------------------------------------------
      - name: Update app_version.json
        run: |
          VERSION="2.0.${{ github.run_number }}"
          printf '{\n  "latest_version": "%s",\n  "update_message": "A new version is available.",\n  "force": false\n}\n' "$VERSION" > app_version.json

      - name: Commit app_version.json
        if: "! contains(github.event.head_commit.message, 'CI:')"
        run: |
          VERSION="2.0.${{ github.run_number }}"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add app_version.json
          git commit -m "CI: Update version JSON to $VERSION"
          # Reconcile with any commits pushed mid-build (see pubspec step).
          git pull --rebase origin master
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------
  # WEB BUILD & DEPLOY to GitHub Pages
  # ------------------------------------------------------------
  build_web:
    runs-on: ubuntu-latest
    needs: [test, integration_test]
    # Pages deployment is master-push/manual only — never from pull requests.
    # Gated on the unit/widget suite and — only when an opt-in E2E run actually
    # happens — on the E2E suite (same status guard as the `build` job).
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.integration_test.result == 'success' || needs.integration_test.result == 'skipped') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Add google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build Web (Release)
        run: flutter build web --release --base-href /WealthSync/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          user_name: "GitHub Actions"
          user_email: "actions@github.com"
